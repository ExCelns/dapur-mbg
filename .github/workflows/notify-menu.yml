name: Notifikasi Menu MBG Harian

on:
  schedule:
    # Jaring pengaman: cek tiap 30 menit selama jam ~05:07-09:37 WIB.
    # Sengaja pakai menit :07 & :37 (BUKAN :00/:30) karena GitHub mendokumentasikan
    # bahwa awal jam & setengah jam adalah waktu paling padat, jadi paling rawan
    # keterlambatan atau bahkan gagal dipicu sama sekali.
    # WIB = UTC+7, jadi jendela ini = 22:00-02:00 UTC (lintas hari UTC).
    - cron: '7,37 22-23,0-2 * * *'
  workflow_dispatch: {} # supaya bisa dijalankan manual dari tab Actions untuk testing

# Dibutuhkan supaya workflow bisa commit balik file penanda (last-notified.txt),
# meskipun setting default repo untuk GITHUB_TOKEN adalah read-only.
permissions:
  contents: write

# Supaya run yang beririsan (jarang terjadi, tapi mungkin di jam sibuk) antre,
# bukan jalan bersamaan dan berebut saat commit file penanda.
concurrency:
  group: notify-menu
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kirim notifikasi menu
        run: node notify-menu.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}

      - name: Simpan penanda tanggal notifikasi terakhir
        run: |
          if [ -n "$(git status --porcelain last-notified.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last-notified.txt
            git commit -m "chore: perbarui penanda notifikasi otomatis"
            git push
          else
            echo "Tidak ada perubahan penanda, lewati commit."
          fi
