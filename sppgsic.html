<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu MBG Hari Ini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <main class="card" id="card">

        <header class="card__header">
            <img class="card__logo"
                src="https://cdn.phototourl.com/free/2026-09-09-ec35e51f-0850-465a-9948-d7c06cb2fc35.png"
                alt="Logo BGN" />
            <div class="card__title">
                <p class="card__eyebrow">Makan Bergizi Gratis</p>
                <h1 class="card__sppg" id="nama-sppg">Memuat…</h1>
                <p class="card__day" id="hari-tanggal">–</p>
                <button class="kembali-btn" id="kembali-hari-ini" hidden>← Kembali ke hari ini</button>
            </div>
        </header>

        <div class="porsi-switch">
            <button class="porsi-arrow" id="porsi-prev" aria-label="Porsi sebelumnya">‹</button>
            <div class="porsi-label" id="porsi-label">Porsi Kecil</div>
            <button class="porsi-arrow" id="porsi-next" aria-label="Porsi berikutnya">›</button>
        </div>
        <div class="porsi-dots" id="porsi-dots">
            <span class="dot aktif" data-porsi="kecil"></span>
            <span class="dot" data-porsi="besar"></span>
        </div>

        <div class="porsi-viewport" id="porsi-viewport">
            <div class="porsi-track" id="porsi-track">

                <!-- ==== SLIDE: PORSI KECIL ==== -->
                <section class="porsi-slide" data-porsi="kecil">
                    <div class="card__photo card__photo--slide" id="foto-wrap-kecil">
                        <img id="foto-menu-kecil" src="" alt="Foto menu porsi kecil" hidden />
                        <div class="card__photo-placeholder" id="foto-placeholder-kecil"></div>
                    </div>

                    <nav class="tabs" data-tabgroup="kecil">
                        <button class="tabs__btn" data-tab="isiOmpreng" aria-selected="true">Isi Ompreng</button>
                        <button class="tabs__btn" data-tab="gizi" aria-selected="false">Gizi</button>
                        <button class="tabs__btn" data-tab="peringatan" aria-selected="false">Peringatan</button>
                    </nav>

                    <section class="panel" data-panel="isiOmpreng">
                        <ul class="panel__list" id="list-isiOmpreng-kecil"></ul>
                        <div class="torn-box torn-box--accent" id="box-penerima-kecil">
                            <p class="torn-box__label">Penerima Manfaat</p>
                            <p class="torn-box__angka" id="angka-penerima-kecil">–</p>
                        </div>
                    </section>

                    <section class="panel" data-panel="gizi" hidden>
                        <ul class="panel__list panel__list--gizi" id="list-gizi-kecil"></ul>
                    </section>

                    <section class="panel" data-panel="peringatan" hidden>
                        <div class="notice">
                            <p class="notice__title">Peringatan</p>
                            <div class="notice__text" id="teks-peringatan-kecil"></div>
                        </div>
                    </section>
                </section>

                <!-- ==== SLIDE: PORSI BESAR ==== -->
                <section class="porsi-slide" data-porsi="besar">
                    <div class="card__photo card__photo--slide" id="foto-wrap-besar">
                        <img id="foto-menu-besar" src="" alt="Foto menu porsi besar" hidden />
                        <div class="card__photo-placeholder" id="foto-placeholder-besar"></div>
                    </div>

                    <nav class="tabs" data-tabgroup="besar">
                        <button class="tabs__btn" data-tab="isiOmpreng" aria-selected="true">Isi Ompreng</button>
                        <button class="tabs__btn" data-tab="gizi" aria-selected="false">Gizi</button>
                        <button class="tabs__btn" data-tab="peringatan" aria-selected="false">Peringatan</button>
                    </nav>

                    <section class="panel" data-panel="isiOmpreng">
                        <ul class="panel__list" id="list-isiOmpreng-besar"></ul>
                        <div class="torn-box torn-box--accent" id="box-penerima-besar">
                            <p class="torn-box__label">Penerima Manfaat</p>
                            <p class="torn-box__angka" id="angka-penerima-besar">–</p>
                        </div>
                    </section>

                    <section class="panel" data-panel="gizi" hidden>
                        <ul class="panel__list panel__list--gizi" id="list-gizi-besar"></ul>
                    </section>

                    <section class="panel" data-panel="peringatan" hidden>
                        <div class="notice">
                            <p class="notice__title">Peringatan</p>
                            <div class="notice__text" id="teks-peringatan-besar"></div>
                        </div>
                    </section>
                </section>

            </div>
        </div>

        <section class="week">
            <h2 class="week__title">Menu minggu ini</h2>
            <ul class="week__list" id="week-list"></ul>
        </section>

        <footer class="card__footer">
            <span id="footer-dapur">Disiapkan di dapur —</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>

</html>
