name: Notifikasi Menu MBG Harian

on:
  schedule:
    # Tiap 30 menit sepanjang hari. Script sendiri yang membatasi jam aktif proses
    # lewat CHECK_START_HOUR_WIB / CHECK_END_HOUR_WIB di notify-menu.js.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # supaya bisa dijalankan manual dari tab Actions untuk testing

permissions:
  contents: write # perlu supaya job ini boleh push balik file state ke repo

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kirim notifikasi menu
        run: node notify-menu.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}

      # Runner GitHub Actions selalu mulai dari lingkungan kosong tiap run, jadi
      # .state/last-sent.json yang ditulis notify-menu.js akan hilang lagi kalau
      # tidak di-commit balik ke repo. Step ini yang menjaganya tetap ada di run berikutnya.
      - name: Simpan state "sudah terkirim" balik ke repo
        if: always()
        run: |
          if [ -n "$(git status --porcelain .state/last-sent.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f .state/last-sent.json
            git commit -m "chore: update status notifikasi terkirim [skip ci]"
            git pull --rebase
            git push
          else
            echo "Tidak ada perubahan state, lewati commit."
          fi
